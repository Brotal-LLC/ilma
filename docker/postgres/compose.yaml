name: ilma

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ilma-postgres
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${ILMA_POSTGRES_DB:-ilma}
      POSTGRES_USER: ${ILMA_POSTGRES_USER:-ilma}
      POSTGRES_PASSWORD: ${ILMA_POSTGRES_PASSWORD:-ilma}
    ports:
      - "${ILMA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      ilma: {}

volumes:
  postgres-data:
    name: ilma-postgres-data

networks:
  ilma:
    name: ilma
    driver: bridge
    attachable: true
