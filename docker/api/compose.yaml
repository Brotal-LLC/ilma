name: ilma

include:
  - ../postgres/compose.yaml

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    image: ilma-api:latest
    container_name: ilma-api
    user: "1000:1000"
    init: true
    restart: unless-stopped
    environment:
      # Override ILMA_DSN when changing the Postgres defaults below or when
      # pointing the API at an external production database.
      ILMA_DSN: ${ILMA_DSN:-postgresql://ilma:ilma@postgres:5432/ilma}
      ILMA_API_KEY: ${ILMA_API_KEY:-change-me}
      ILMA_PG_POOL_MIN: ${ILMA_PG_POOL_MIN:-1}
      ILMA_PG_POOL_MAX: ${ILMA_PG_POOL_MAX:-8}
      ILMA_RATE_LIMIT_RPS: ${ILMA_RATE_LIMIT_RPS:-30}
      ILMA_CORS_ORIGINS: ${ILMA_CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ILMA_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read(); sys.exit(0)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      ilma: {}

networks:
  ilma:
    name: ilma
    driver: bridge
    attachable: true
