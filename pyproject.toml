[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ilma"
version = "0.1.0"
description = "Framework-agnostic agent memory system — Postgres + pgvector + MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Brotal LLC", email = "hello@brotal.co" },
]
keywords = ["memory", "agent", "mcp", "postgres", "pgvector", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pgvector>=0.2",
    "numpy>=1.24",
    "typer>=0.12",
    "pydantic>=2.0",
    "python-dateutil>=2.8",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "mcp>=1.0",
]

[project.optional-dependencies]
http = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.0"]
ollama = ["httpx>=0.27"]
openai = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.9",
    "testcontainers>=4.0",
]

[project.scripts]
ilma = "ilma.api.cli:main"
ilma-mcp = "ilma.api.mcp:main"

[project.entry-points."hermes_agent.plugins"]
ilma = "ilma.adapters.hermes.register:register"

[project.entry-points."ilma.backends"]
postgres = "ilma.storage.postgres:PgBackend"
memory = "ilma.storage.memory:InMemoryBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/ilma"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
