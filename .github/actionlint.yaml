self-hosted-runner:
  # Labels attached to all self-hosted runners on Brotal-LLC. As of
  # 2026-06-10 there are 5 org-scoped runners on Brotal-LLC:
  #
  #   On rogue (10.49.10.10, 4c/7GB/80GB):
  #     - rogue-runner-1
  #     - rogue-runner-2
  #
  #   On inframework (10.49.10.1, 16c/61GB/401GB), in-Docker-dind
  #   (3 GB build cap, 1 GB agent cap per stack):
  #     - inframework-runner-1
  #     - inframework-runner-2
  #     - inframework-runner-3
  #
  #   All 5 runners have the default labels [self-hosted, Linux, X64].
  #   The three inframework runners also carry the custom label [inframework]
  #   so Docker-heavy publish jobs avoid the host-native rogue runners.
  #   Any workflow in Brotal-LLC/* can target all runners with
  #     runs-on: self-hosted
  #   or target only the in-Docker-dind pool with
  #     runs-on: [self-hosted, Linux, X64, inframework]
  labels:
    - self-hosted
    - Linux
    - X64
    - inframework
