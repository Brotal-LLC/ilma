# ==============================================================================
# ilma — single gated workflow
#
# Consolidates lint + test + security + tag + build + release into one file.
# Mirrors the phased structure of skb50bd/sv/.github/workflows/sv.yml.
#
# INTENTIONALLY EXCLUDED (vs. sv):
#   - Deploy job. The user has directed that ilma is distributed as a package
#     (PyPI + GHCR image) and the CI flow must NOT mutate the user's local
#     installation. Deploy-to-ilma.aamar.cloud is a local manual step via
#     ~/infra/scripts/deploy-ilma.sh, not a CI/CD concern.
#   - PyPI publish is gated behind workflow_dispatch `publish_pypi=true` or
#     `v*` tag pushes via Trusted Publishing OIDC. No long-lived PyPI token is
#     required; PyPI must have a pending trusted publisher for this workflow.
#   - Coverage gate. No coverage tooling is configured; re-add when
#     pytest-cov is in pyproject.toml [dependency-groups.dev].
#   - E2E job. The unit tests + the post-deploy smoke test (when the user runs
#     it manually) are sufficient for v0.2.0.
# ==============================================================================

name: ilma

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".hadolint.yaml"
      - "docker/**"
      - ".github/workflows/ilma.yml"
      - ".github/actionlint.yaml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".hadolint.yaml"
      - "docker/**"
      - ".github/workflows/ilma.yml"
      - ".github/actionlint.yaml"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the built wheel/sdist to PyPI"
        type: boolean
        default: false
      push_docker:
        description: "Build and push the ilma CLI image (ghcr.io/brotal-llc/ilma)"
        type: boolean
        default: false
      push_pg:
        description: "Build and push the ilma Postgres image (ghcr.io/brotal-llc/ilma-pg)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ilma-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ==============================================================================
# PHASE 1 — Lint (PR + push, ~30s)
# Cheap, parallel checks. Fails fast on syntax / formatting.
# ==============================================================================
jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64, inframework]
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7 /tmp
          /tmp/actionlint -config-file .github/actionlint.yaml .github/workflows/*.yml

      - name: hadolint
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /tmp/hadolint
          chmod +x /tmp/hadolint
          /tmp/hadolint -c .hadolint.yaml Dockerfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install
        run: uv sync --python 3.11 --extra http --extra mcp --group dev
        env:
          UV_LINK_MODE: copy

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy
        run: uv run mypy src/ilma --ignore-missing-imports

# ==============================================================================
# PHASE 2 — Test (PR + push, ~2-3 min, parallel with lint)
# Matrix 3.11 + 3.12 against Testcontainers-managed pgvector.
# ==============================================================================
  test:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64, inframework]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
          enable-cache: true
      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Install
        run: uv sync --python "${{ matrix.python-version }}" --extra http --extra mcp --group dev
        env:
          UV_LINK_MODE: copy
      - name: Clean Testcontainers leftovers
        run: |
          docker ps -aq --filter "name=testcontainers-" | xargs -r docker rm -f
      - name: Configure Testcontainers Docker-in-Docker host
        if: contains(runner.name, 'inframework-runner')
        run: echo "TESTCONTAINERS_HOST_OVERRIDE=dind" >> "$GITHUB_ENV"
      - name: Test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest tests/ -v --tb=short
      - name: Clean Testcontainers leftovers
        if: always()
        run: |
          docker ps -aq --filter "name=testcontainers-" | xargs -r docker rm -f

# ==============================================================================
# PHASE 3 — Security (PR + push, parallel with test, ~1 min)
# TruffleHog for verified-secret scanning. hadolint already runs in the lint
# phase, so we don't duplicate it here.
# ==============================================================================
  security:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64, inframework]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /tmp
          /tmp/trufflehog git file://"$GITHUB_WORKSPACE" --fail --no-update --github-actions --only-verified

# ==============================================================================
# PHASE 4 — Tag (push to main/tag or manual full-CI dispatch, ~5s)
# Compute the short commit SHA so downstream build jobs tag the GHCR image
# consistently. Mirrors sv.yml:365-384.
# =============================================================================
  tag:
    needs: [lint, test, security]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.push_docker)
    runs-on: [self-hosted, Linux, X64, inframework]
    outputs:
      build_tag: ${{ steps.sha.outputs.value }}
    steps:
      - name: Use short commit SHA as tag
        id: sha
        run: |
          SHORT="${GITHUB_SHA::7}"
          echo "value=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Build tag: ${SHORT}"

# ==============================================================================
# PHASE 5 — Build & publish image (push to main/tag or manual full-CI dispatch, gated on tag)
# Single image (ghcr.io/brotal-llc/ilma) tagged with the short SHA. Main pushes
# also get `main` + `latest`; tag pushes get the tag name; manual dispatches get
# `workflow`. Layer-cached via GHA cache.
# =============================================================================
  build:
    needs: [tag]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.push_docker)
    runs-on: [self-hosted, Linux, X64, inframework]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: brotal-llc/ilma
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          # Build the full registry/path:tag list without using
          # docker/metadata-action. v5/v6 of that action rewrites raw
          # tag values to a slugified image-name form (e.g.
          # `ghcr.io/brotal-llc/ilma:main` becomes
          # `ghcr.io-brotal-llc-ilma-main`), so we build the tag list in a
          # shell step and hand it straight to build-push-action.
          SHORT_SHA="${GITHUB_SHA::7}"
          EVENT="${GITHUB_EVENT_NAME:-push}"
          REF="${GITHUB_REF:-refs/heads/main}"
          TAGS="${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:main,${REGISTRY}/${IMAGE_NAME}:latest"
          fi
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            TAG_NAME="${REF#refs/tags/}"
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${TAG_NAME}"
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:workflow"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Pushing tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ilma
            org.opencontainers.image.description=Framework-agnostic agent memory system — Postgres + pgvector + MCP
            org.opencontainers.image.source=https://github.com/Brotal-LLC/ilma
            org.opencontainers.image.url=https://github.com/Brotal-LLC/ilma
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

# ==============================================================================
# PHASE 5b — Build & publish Postgres image (push to main/tag or manual
# workflow_dispatch with push_pg=true, gated on tag).
#
# Builds ghcr.io/brotal-llc/ilma-pg — Postgres 18 with pgvector, pg_cron,
# timescaledb, pg_trgm, ltree, and Apache AGE preinstalled. The ilma
# Python package's initialize_schema() creates the ilma schema and tables
# on first API connection; this image just provides a clean DB with
# extensions ready.
#
# Tagging rules mirror build (ghcr.io/brotal-llc/ilma): :{short-sha} on every
# push, plus :main + :latest on main, plus :{tag-name} on v* tag pushes.
# ==============================================================================
  build-pg:
    needs: [tag]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.push_pg)
    runs-on: [self-hosted, Linux, X64, inframework]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: brotal-llc/ilma-pg
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          EVENT="${GITHUB_EVENT_NAME:-push}"
          REF="${GITHUB_REF:-refs/heads/main}"
          TAGS="${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:main,${REGISTRY}/${IMAGE_NAME}:latest"
          fi
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            TAG_NAME="${REF#refs/tags/}"
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${TAG_NAME}"
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:workflow"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Pushing tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./pg/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ilma-pg
            org.opencontainers.image.description=Postgres 18 + pgvector + pg_cron + timescaledb + apache-age for ilma
            org.opencontainers.image.source=https://github.com/Brotal-LLC/ilma
            org.opencontainers.image.url=https://github.com/Brotal-LLC/ilma
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

# ==============================================================================
# PHASE 6 — Release / PyPI publish (push `v*` tag or manual full-CI dispatch, gated on build)
# Publishes the package to PyPI via Trusted Publishing (OIDC, no long-lived
# secret). GitHub release creation stays tag-only.
#
# PyPI Trusted Publishing setup (one-time, by hand):
#   1. https://pypi.org/manage/account/publishing/ → "Add pending publisher"
#   2. PyPI Project Name: ilma-agent
#      Owner:               Brotal-LLC
#      Repository name:     ilma
#      Workflow filename:   ilma.yml
#      Environment name:    production
#   3. First v* push will create the project on PyPI via this workflow.
#
# The "ilma" GitHub repo name, the `import ilma` Python path, the
# `ilma` and `ilma-mcp` console scripts, and the `ghcr.io/brotal-llc/ilma`
# Docker image are all UNAFFECTED by this distribution name — only
# `pip install ilma-agent` and `pypi.org/project/ilma-agent` change.
# The bare name "ilma" on PyPI is blocked by similarity to an existing
# "ilmarine" project (Feb 2022, internal-pypi upload squat), so we
# publish under the hyphenated "ilma-agent" distribution name.
#
# Does NOT deploy to ilma.aamar.cloud (user OOB: CI must not mutate
# local environment).
# ==============================================================================
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    runs-on: [self-hosted, Linux, X64, inframework]
    permissions:
      # contents: write — gh release create
      # id-token: write — PyPI Trusted Publishing OIDC handshake
      contents: write
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_NON_INTERACTIVE: "1"
        run: |
          python -m pip install --upgrade twine

          # Exchange GitHub OIDC token for a short-lived PyPI API token.
          id_token=$(python3 -c '
          import json, os, urllib.request, urllib.error
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=pypi"
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              print(f"GitHub OIDC token request failed: {e.code} {body}", file=__import__("sys").stderr)
              raise
          print(data["value"])
          ')

          pypi_token=$(python3 -c '
          import json, os, urllib.request, urllib.error
          id_token = """'"$id_token"'"""
          payload = json.dumps({"token": id_token}).encode()
          req = urllib.request.Request(
              "https://pypi.org/_/oidc/mint-token",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              print(f"PyPI mint-token failed: {e.code} {body}", file=__import__("sys").stderr)
              raise
          print(data["token"])
          ')

          echo "::add-mask::$pypi_token"
          TWINE_PASSWORD="$pypi_token" python -m twine upload --verbose dist/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

